<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe | Java Web Game</title>
  <style>
    :root { --blue:#2563eb; --purple:#5b45c7; --pink:#f43f5e; --ink:#1e2a4a; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:28px 16px;
      font-family:Inter,Segoe UI,Arial,sans-serif; color:var(--ink);
      background:linear-gradient(145deg,#f5f8ff,#eef2ff 55%,#fff5f7);
    }
    .hero {
      max-width:1050px; margin:0 auto 24px; padding:28px 20px;
      text-align:center; color:white; border-radius:22px;
      background:linear-gradient(120deg,#304887,var(--purple));
      box-shadow:0 14px 32px #283b7626;
    }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.2rem); letter-spacing:-1px; }
    .tagline { margin:9px 0 0; color:#e4e8ff; }
    .layout {
      max-width:1050px; margin:auto; display:grid;
      grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr);
      gap:22px; padding:24px; border:1px solid #e1e8fb;
      border-radius:22px; background:#ffffffdf;
      box-shadow:0 18px 45px #34467512;
    }
    .board { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .cell {
      aspect-ratio:1; border:2px solid #d7e1f7; border-radius:16px;
      background:linear-gradient(145deg,#fff,#f7faff); cursor:pointer;
      font-size:clamp(2.2rem,7vw,4.5rem); font-weight:800;
      color:#8997b5; transition:transform .15s,border-color .15s,background .15s;
    }
    .cell:hover:enabled { transform:translateY(-2px); border-color:#8ea9f7; background:#f0f5ff; }
    .cell:disabled { cursor:default; }
    .cell.x { color:var(--blue); }
    .cell.o { color:var(--pink); }
    .side { padding:22px; border:1px solid #e0e7f6; border-radius:16px; background:#fbfcff; }
    h2 { margin:0 0 16px; font-size:1.45rem; }
    .status { padding:15px 12px; border-radius:12px; background:#eaf0ff; color:#344fc0; font-weight:750; text-align:center; }
    .players { margin:24px 0; display:grid; gap:16px; }
    .player { display:flex; align-items:center; gap:14px; font-weight:700; }
    .symbol { width:42px; text-align:center; font-size:2.5rem; font-weight:900; }
    .symbol.x { color:var(--blue); } .symbol.o { color:var(--pink); }
    .small { display:block; margin-top:3px; font-size:.9rem; color:#7785a5; font-weight:500; }
    .btn {
      width:100%; padding:15px 18px; border:0; border-radius:12px;
      background:linear-gradient(110deg,var(--blue),#4d63e8); color:white;
      font-size:1rem; font-weight:750; cursor:pointer;
      box-shadow:0 8px 18px #2563eb2b; transition:transform .15s;
    }
    .btn:hover { transform:translateY(-1px); }
    .hint { grid-column:1/-1; margin:0; padding:16px; text-align:center;
      border-radius:14px; background:#f0efff; color:#5544b9; }
    @media (max-width:720px) {
      .layout { grid-template-columns:1fr; padding:14px; }
      .side { padding:18px; }
      .hint { grid-column:auto; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Tic Tac Toe</h1>
    <p class="tagline">Think <span aria-hidden="true">•</span> Move <span aria-hidden="true">•</span> Win</p>
  </header>

  <main class="layout">
    <section aria-label="Game board">
      <div class="board" id="board">
        <button class="cell" aria-label="Square 1" data-position="0">1</button>
        <button class="cell" aria-label="Square 2" data-position="1">2</button>
        <button class="cell" aria-label="Square 3" data-position="2">3</button>
        <button class="cell" aria-label="Square 4" data-position="3">4</button>
        <button class="cell" aria-label="Square 5" data-position="4">5</button>
        <button class="cell" aria-label="Square 6" data-position="5">6</button>
        <button class="cell" aria-label="Square 7" data-position="6">7</button>
        <button class="cell" aria-label="Square 8" data-position="7">8</button>
        <button class="cell" aria-label="Square 9" data-position="8">9</button>
      </div>
    </section>

    <aside class="side">
      <h2>Game Status</h2>
      <div class="status" id="status" aria-live="polite">Loading game…</div>
      <h2 style="margin-top:24px">Players</h2>
      <div class="players">
        <div class="player"><span class="symbol x">×</span><span>Player X<span class="small">First player</span></span></div>
        <div class="player"><span class="symbol o">○</span><span>Player O<span class="small">Second player</span></span></div>
      </div>
      <h2>Controls</h2>
      <button class="btn" id="reset">↻ &nbsp; New Game</button>
    </aside>

    <p class="hint">ⓘ &nbsp; Click a square to make your move. Get three in a row to win!</p>
  </main>

  <script>
    const cells = [...document.querySelectorAll(".cell")];
    const statusBox = document.getElementById("status");

    // Ask the Java backend for the latest game state and update the page.
    function render(game) {
      statusBox.textContent = game.status;
      cells.forEach((cell, i) => {
        const value = game.board[i];
        cell.textContent = value || (i + 1);
        cell.classList.toggle("x", value === "X");
        cell.classList.toggle("o", value === "O");
        cell.disabled = Boolean(value) || game.gameOver;
        cell.setAttribute("aria-label", `Square ${i + 1}${value ? ": " + value : ""}`);
      });
    }

    async function loadGame() {
      try {
        const response = await fetch("/api/game");
        if (!response.ok) throw new Error("Could not load game");
        render(await response.json());
      } catch (error) {
        statusBox.textContent = "Could not connect to the Java server.";
      }
    }

    cells.forEach(cell => {
      cell.addEventListener("click", async () => {
        try {
          const response = await fetch(`/api/game/move/${cell.dataset.position}`, { method: "POST" });
          render(await response.json());
        } catch (error) {
          statusBox.textContent = "Move failed. Please check the server.";
        }
      });
    });

    document.getElementById("reset").addEventListener("click", async () => {
      const response = await fetch("/api/game/reset", { method: "POST" });
      render(await response.json());
    });

    loadGame();
  </script>
</body>
</html>
